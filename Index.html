<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智能障礙事件樹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ 顏色與字體 ============
   淺色與深色各一組；圖表用的資料色兩種主題都用色盲模擬檢查過 */
:root{
  --bg:#EAECE6; --paper:#F7F8F4; --stage:#E1E4DD; --ink:#1F2A2E; --ink2:#37444A; --muted:#525F65; --line:#CBD2CB; --line2:#AEB7AE;
  --c-test:#2F6187; --c-law:#8C6013;
  --g1:#EFECE4; --g2:#E1DBCE; --g3:#D0C8B6; --g4:#BCB2A0;
  --d1:#376fb0; --d2:#c26a3d; --d3:#17998a; --d4:#a8841a; --d5:#b0668f; --d6:#5f8f3a; --rose:#2F6187; --link:#2F6187; --ctl:#79847E;
  --trk:rgba(31,42,46,.045); --trk2:rgba(31,42,46,.11);
  --hero-bg:#17262D; --hero-fg:#EEF1EB; --hero-mut:#A9B5B4; --hero-a:#8FB6D4; --hero-b:#DDB565;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","標楷體",serif;
  --gut:40px; --r:12px; --mast:62px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171B1C; --paper:#20272A; --stage:#14181A; --ink:#E6EAE5; --ink2:#C7CFCB; --muted:#9BA6A8; --line:#384344; --line2:#4E5A5B;
  --c-test:#82ABCB; --c-law:#DDB35F;
  --g1:#282C2A; --g2:#333733; --g3:#41453D; --g4:#4F5348;
  --d1:#5289d4; --d2:#c9703f; --d3:#24a08e; --d4:#b08720; --d5:#bd689b; --d6:#6ea040; --rose:#82ABCB; --link:#82ABCB; --ctl:#7E8A8B;
  --trk:rgba(230,234,229,.07); --trk2:rgba(230,234,229,.15);
  --hero-bg:#0D1315; --hero-fg:#E6EAE5; --hero-mut:#93A0A2; --hero-a:#82ABCB; --hero-b:#DDB35F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171B1C; --paper:#20272A; --stage:#14181A; --ink:#E6EAE5; --ink2:#C7CFCB; --muted:#9BA6A8; --line:#384344; --line2:#4E5A5B;
  --c-test:#82ABCB; --c-law:#DDB35F;
  --g1:#282C2A; --g2:#333733; --g3:#41453D; --g4:#4F5348;
  --d1:#5289d4; --d2:#c9703f; --d3:#24a08e; --d4:#b08720; --d5:#bd689b; --d6:#6ea040; --rose:#82ABCB; --link:#82ABCB; --ctl:#7E8A8B;
  --trk:rgba(230,234,229,.07); --trk2:rgba(230,234,229,.15);
  --hero-bg:#0D1315; --hero-fg:#E6EAE5; --hero-mut:#93A0A2; --hero-a:#82ABCB; --hero-b:#DDB35F; color-scheme:dark;
}

/* ============ 基本 ============ */
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--mast) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);overflow-wrap:anywhere}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--link);text-underline-offset:3px}
img{max-width:100%}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--gut)}
.skip{position:absolute;left:8px;top:-60px;z-index:100;padding:10px 16px;background:var(--ink);color:var(--paper);border-radius:8px;text-decoration:none}
.skip:focus{top:8px}
#view{min-height:60vh}
#view.enter{animation:fadeIn .24s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view > .wrap{padding-bottom:20px}

/* ============ 頁首：站名與展區 ============ */
.mast{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
@supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){ .mast{background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)} }
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:var(--mast)}
.brand{font-family:var(--serif);font-weight:700;font-size:1.12rem;letter-spacing:.05em;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav{display:flex;align-items:stretch;gap:2px;margin-right:-13px}
.nav a{position:relative;display:flex;align-items:center;min-height:var(--mast);padding:0 13px;font-size:.98rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:700}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}
.nav a:focus-visible{outline-offset:-4px}
/* 首頁：頁首疊在深色的主視覺上 */
body[data-view="home"] .mast{margin-bottom:calc(-1*var(--mast) - 1px)}
.mast.over{background:transparent;border-bottom-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.mast.over .brand{color:var(--hero-fg)}
.mast.over .nav a{color:var(--hero-mut)}
.mast.over .nav a:hover,.mast.over .nav a[aria-current="page"]{color:var(--hero-fg)}
.mast.over .nav a[aria-current="page"]::after{background:var(--hero-fg)}
.mast.over :focus-visible{outline-color:var(--hero-fg)}

/* ============ 展區的標題區 ============ */
.ph{padding:24px 0 16px}
.ph-over{display:flex;align-items:center;gap:10px;min-height:1.3em;font-size:.78rem;letter-spacing:.16em;color:var(--muted);margin-bottom:6px}
.ph-site{display:none}
.ph-no::before{content:"";display:inline-block;width:26px;height:1px;background:var(--line2);vertical-align:middle;margin-right:10px}
.ph-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.ph-tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.ph-tools .btn{flex:none;min-height:38px;padding:4px 14px;font-size:.88rem}
.btn.how::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;font-size:.72rem;font-weight:700;line-height:1}
.ph h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.6rem,1.15rem + 1.9vw,2.3rem);line-height:1.28;letter-spacing:.02em}
.ph h1:focus{outline:none}
.ph-lead{font-family:var(--kai);font-size:1.08rem;line-height:1.7;color:var(--ink2);max-width:46em;margin-top:8px}
.ph-lead:empty{display:none}
/* 展區裡的兩種看法（剪報：編碼分析／清單），做成兩張看得到說明的大頁籤 */
.subnav{display:flex;gap:10px;margin-bottom:18px}
.subnav a{display:grid;min-width:168px;padding:9px 18px 10px;border:1.5px solid var(--ctl);border-radius:var(--r);background:var(--paper);color:var(--ink);text-decoration:none;line-height:1.4}
.subnav a b{font-size:1rem}
.subnav a small{font-size:.8rem;color:var(--muted)}
.subnav a:hover{border-color:var(--ink)}
.subnav a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.subnav a[aria-current="page"] small{color:var(--paper);opacity:.82}

/* ============ 控制項 ============ */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.lbl{font-size:.88rem;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--ctl);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;min-height:42px;padding:6px 18px;font-size:.95rem}
.seg button+button{border-left:1.5px solid var(--ctl)}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.seg button:focus-visible{outline-offset:-4px;border-radius:999px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 4px;font-size:.95rem;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 16px;border:1.5px solid var(--ctl);border-radius:999px;background:var(--paper);font-size:.94rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"],.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.38;cursor:default;border-color:var(--ctl)}
.btn.wide{width:100%;border-radius:10px;margin-top:14px}
.src{font-size:.88rem;color:var(--muted);margin-left:auto;max-width:38em;text-align:right}

/* ============ 版面的積木：紙面、圖、數字 ============ */
.plate{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.plate,.grid2,.stats,.fig,.more{margin-bottom:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.grid2 > *{margin-bottom:0}
.fig h2,.nlist h2{font-family:var(--serif);font-weight:600;font-size:1.22rem;line-height:1.4;letter-spacing:.01em}
.note{color:var(--muted);font-size:.9rem;line-height:1.65;max-width:50em;margin-top:4px}
.chart{min-width:0;margin-top:14px}
.chart svg{display:block;max-width:100%;height:auto}
.chart text{font-family:var(--sans);font-variant-numeric:tabular-nums}
.lgd{list-style:none;display:flex;flex-wrap:wrap;gap:4px 16px;padding:0;margin-top:10px;font-size:.86rem;color:var(--ink2)}
.lgd li{display:inline-flex;align-items:center;gap:6px}
.lgd i{flex:none;width:11px;height:11px;border-radius:3px}
.lgd i.ln{width:16px;height:3px;border-radius:2px}
.lgd b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.lgd li.bold{font-weight:700;color:var(--ink)}
.colbar{outline:none}
.colbar:hover rect:last-child{fill:var(--ink);fill-opacity:.06}
.colbar:focus-visible rect:last-child{stroke:var(--ink);stroke-width:2}
.xmark{cursor:pointer;outline:none}
.xmark .xlab{display:none}
.xmark:hover .xlab,.xmark:focus-visible .xlab,.xmark.on .xlab{display:block}
.xmark:hover .ring,.xmark.on .ring{fill-opacity:.9}
.xmark:focus-visible .ring{stroke-width:3.5}
/* 幾個大數字排成一列 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:18px 24px 16px}
.stat+.stat{border-left:1px solid var(--line)}
.stat dt{font-size:.88rem;color:var(--muted)}
.stat .v{font-family:var(--serif);font-weight:700;font-size:2.05rem;line-height:1.25;font-variant-numeric:tabular-nums lining-nums}
.stat .v small{font-family:var(--sans);font-size:.95rem;font-weight:500;margin-left:5px}
.stat .sub{font-size:.86rem;color:var(--muted)}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums;margin-top:8px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.tbl thead th{font-weight:700;color:var(--ink2);vertical-align:bottom;line-height:1.3}
.tbl tbody th{font-weight:500;color:var(--muted)}
.tbl th:first-child{text-align:left}
.heat{width:100%;border-collapse:separate;border-spacing:2px;font-size:.88rem;font-variant-numeric:tabular-nums;margin-top:12px}
.heat th,.heat td{padding:7px 8px}
.heat thead th{font-weight:600;font-size:.84rem;color:var(--ink2);text-align:center;vertical-align:bottom;line-height:1.3;white-space:nowrap}
.heat thead th small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.heat thead .corner{text-align:left}
.heat tbody th{text-align:left;font-weight:500;line-height:1.4}
.heat tbody th small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.heat td{text-align:center;border-radius:5px;min-width:3.2em;background:color-mix(in srgb,var(--rose) calc(var(--a,0)*100%),transparent)}
.heat td.tot{background:none;font-weight:700}
/* 可以展開的區塊 */
.more{padding:6px 24px}
.more[open]{padding-bottom:20px}
.more > summary,.tr > summary{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:700;cursor:pointer;list-style:none}
.more > summary::-webkit-details-marker,.tr > summary::-webkit-details-marker{display:none}
.more > summary::before,.tr > summary::before{content:"";width:8px;height:8px;margin-left:2px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .15s}
.more[open] > summary::before,.tr[open] > summary::before{transform:rotate(45deg)}
.sample{font-size:.88rem;color:var(--ink2);background:var(--paper);border:1px dashed var(--line2);border-radius:8px;padding:9px 14px;margin-bottom:16px}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty h2{font-family:var(--serif);color:var(--ink);font-size:1.3rem;margin-bottom:6px}
.kai{font-family:var(--kai);font-size:1.05rem;line-height:1.75}
.ico{flex:none;display:inline-block;vertical-align:-2px}

/* ============ 時間軸 ============ */
.tl{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.tl.wide{grid-template-columns:minmax(0,1fr) 370px;align-items:start}
.keys{list-style:none;display:flex;flex-wrap:wrap;gap:4px 18px;padding:0;margin-bottom:10px;font-size:.9rem;color:var(--ink2)}
.keys li{display:inline-flex;align-items:center;gap:6px}
.plate.tl-fig{padding:0;overflow:hidden;margin-bottom:0}
.tl-fig svg{display:block}
.tl-terms{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:5px 14px;border:1.5px solid var(--ctl);border-radius:999px;background:var(--paper);font-size:.92rem}
.tchip i{flex:none;width:15px;height:15px;border-radius:4px;background:var(--c);border:1px solid var(--line2)}
.tchip:hover{border-color:var(--ink)}
.tchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.tchip.sm{min-height:34px;padding:2px 11px;font-size:.86rem;color:var(--ink)}
.tsvg text{font-family:var(--sans);fill:var(--ink)}
.tsvg .rootlab{font-family:var(--serif);font-weight:700}
.tsvg .inv{fill:var(--paper)}
.tsvg .cav{fill:var(--ink2);pointer-events:none}
.tsvg .bname text{font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.tsvg .dec{cursor:pointer;outline:none}
.tsvg .dec .dbox{fill:var(--paper);fill-opacity:0;stroke:transparent;stroke-width:1.5px}
.tsvg .dec text{fill:var(--ink2);font-variant-numeric:tabular-nums}
.tsvg .dec:hover .dbox{fill-opacity:1;stroke:var(--line2)}
.tsvg.lanes .dec .dbox{fill-opacity:.92;stroke:var(--line2)}
.tsvg .dec.on .dbox{fill:var(--ink);fill-opacity:1;stroke:var(--ink)}
.tsvg .dec.on text{fill:var(--paper);font-weight:700}
.tsvg .dec:focus-visible .dbox{fill-opacity:1;stroke:var(--ink);stroke-width:2.5px}
.tsvg .ev{cursor:pointer;outline:none}
.tsvg .ev .mk{fill:var(--paper);stroke:var(--c);stroke-width:2.6px}
.tsvg .ev.on .mk{fill:var(--c)}
.tsvg .ev.dim{opacity:.36}
.tsvg .ev .lb{fill:var(--paper);fill-opacity:.9;stroke:transparent;stroke-width:1.5px}
.tsvg .ev .lt{font-weight:600}
.tsvg .ev:hover .lb{stroke:var(--c)}
.tsvg .ev.on .lb{fill:var(--ink);fill-opacity:1;stroke:var(--ink)}
.tsvg .ev.on .lt{fill:var(--paper)}
.tsvg .ev:focus-visible .lb{stroke:var(--ink);stroke-width:2.5px}
.tsvg .row .rowbg{fill:var(--paper);fill-opacity:0;stroke:transparent;stroke-width:2px}
.tsvg .row:hover .rowbg{fill-opacity:.55}
.tsvg .row.on .rowbg{fill-opacity:.97;stroke:var(--ink)}
.tsvg .row:focus-visible .rowbg{fill-opacity:.8;stroke:var(--ink)}
.tsvg .row.on .lt{fill:var(--ink)}
.tsvg .row .lead{stroke:var(--c);stroke-width:1.2px;opacity:.55}
.tsvg .row .yr{fill:var(--ink2);font-variant-numeric:tabular-nums}
/* 說明：右邊一欄，或從下方滑出 */
.plate.panel{position:sticky;top:calc(var(--mast) + 18px);max-height:calc(100vh - var(--mast) - 36px);overflow:auto;padding:22px 24px 24px;margin-bottom:0}
.pn-kind{display:flex;align-items:center;gap:7px;font-size:.84rem;letter-spacing:.06em;color:var(--muted)}
.pn-kind .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line2)}
.panel h2,.sheet-body h2{font-family:var(--serif);font-weight:700;font-size:1.45rem;line-height:1.35;margin-top:2px}
.panel h2:focus,.sheet-body h2:focus{outline:none}
.pn-date{font-family:var(--serif);font-size:1.02rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.pn-desc{margin-top:12px;font-size:.97rem;line-height:1.8}
.pn-desc p+p{margin-top:8px}
.memo{margin-top:12px;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:.92rem;line-height:1.75}
.memo h3,.pn-rel h3,.pn-how h3,.pn-rose h3{font-size:.78rem;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-bottom:4px}
.memo p+p{margin-top:6px}
.pn-terms{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;font-size:.88rem;color:var(--muted)}
.pn-rel,.pn-how,.pn-rose{margin-top:18px}
.jump{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:6px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;background:var(--paper);text-align:left;font-size:.94rem}
.jump span{flex:1}
.jump small{color:var(--muted);font-variant-numeric:tabular-nums}
.jump:hover{border-color:var(--ink);border-left-color:var(--c)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pn-sum{margin-top:14px}
.pn-sum > div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.pn-sum dt{color:var(--muted)}
.pn-sum dd{font-weight:700;text-align:right}
.pn-how ul{padding-left:1.2em;font-size:.92rem;color:var(--ink2)}
.pn-how + p{margin-top:16px}
.pn-rose .rose{width:170px;margin:4px auto 0}
.pn-go{margin-top:10px;font-size:.92rem}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;max-height:62vh;background:var(--paper);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  box-shadow:0 -12px 32px rgba(0,0,0,.16);transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet-bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 6px 0 18px}
.sheet-grip{grid-column:2;width:40px;height:4px;border-radius:2px;background:var(--line2)}
.sheet-x{justify-self:end;min-height:44px;padding:0 12px;border:0;background:none;font-size:.9rem;color:var(--link);text-decoration:underline;text-underline-offset:3px}
.sheet-body{overflow:auto;padding:0 18px 20px;overscroll-behavior:contain}
body.has-sheet #main{padding-bottom:64vh}
/* 文字清單 */
.plate.tlist{padding:8px 22px 18px;margin-bottom:0}
.tlist h2{font-family:var(--serif);font-size:1.05rem;font-weight:700;margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.tlist ol{list-style:none;padding:0}
.litem{display:grid;grid-template-columns:8.6em minmax(0,1fr) auto;align-items:center;gap:2px 14px;width:100%;min-height:48px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:none;text-align:left;font-size:.96rem}
.litem:hover{background:var(--bg)}
.litem[aria-pressed="true"]{border-left-color:var(--c);background:var(--bg)}
.litem .ld{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:.9rem}
.litem .lm{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.84rem}
.litem.dim{opacity:.45}

/* ============ 剪報：圓圈圖 ============ */
.rose{display:block;max-width:100%;height:auto}
.rose text{font-family:var(--sans);fill:var(--ink)}
.rose .trk{fill:var(--trk)}
.rose .pet{fill:var(--rose)}
.rose .hub{fill:var(--paper);stroke:var(--line2);stroke-width:1px}
.rose .dot{fill:var(--line2)}
.rose .hit{fill:transparent}
.rose .rc-c{fill:var(--muted)}
.rose .rc-v,.rose .rc-y{font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums}
.rose .slot{cursor:pointer;outline:none}
.rose .slot:hover .trk{fill:var(--trk2)}
.rose .slot:hover .pet{opacity:1}
.rose .rl-bg{fill:transparent}
.rose .slot.cur .rl-bg{fill:var(--ink)}
.rose .slot.cur .rl{fill:var(--paper);font-weight:700;opacity:1}
.rose .slot:focus-visible .hit{stroke:var(--ink);stroke-width:2.5px}
.rz{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:16px 40px;align-items:center}
.rz-a,.rz-b{min-width:0}
.rz-head{display:flex;align-items:center;justify-content:center;gap:14px}
.rz-title{min-width:11em;text-align:center}
.rz-era{font-family:var(--serif);font-weight:700;font-size:1.9rem;line-height:1.25}
.rz-n{color:var(--muted);font-size:.95rem}
.rz-nav{flex:none;width:44px;height:44px;padding:0 0 4px;border:1.5px solid var(--ctl);border-radius:50%;background:var(--paper);font-size:1.5rem;line-height:1}
.rz-nav:hover{border-color:var(--ink)}
.rz-fig{touch-action:pan-y;min-width:0;margin-top:4px}
.rz-fig .chart{display:flex;justify-content:center;margin-top:0}
.rz-cat{font-family:var(--serif);font-weight:700;font-size:1.25rem;line-height:1.4;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.rz-cat small{font-family:var(--sans);font-weight:400;font-size:.9rem;color:var(--muted)}
.rz-b .chart{margin-top:8px}
.trend .tcol{fill:transparent;cursor:pointer}
.trend .tcol:hover{fill:var(--trk)}
/* 每個年代一個小圓圈，排在折線圖正下方，一欄對一個年代 */
.rstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:2px}
.rmini{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;min-height:48px;padding:6px 0 7px;border:0;border-radius:10px;background:none}
.rmini svg{width:100%;max-width:64px}
.rmini:hover{background:var(--trk)}
.rmini.on{background:var(--trk2)}
.rm-y{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.3}
.rmini.on .rm-y{font-weight:700;color:var(--ink)}
.rz-back{margin-top:10px;text-align:center}
.nlist h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.nlist h2 small{font-family:var(--sans);font-weight:400;font-size:.88rem;color:var(--muted)}
.nempty{color:var(--muted)}
.clips{list-style:none;padding:0;margin-top:6px}
.clips li{display:grid;grid-template-columns:6.4em 5em minmax(0,1fr);gap:2px 14px;padding:12px 2px;border-bottom:1px solid var(--line)}
.clips li:last-child{border-bottom:0}
.clips .nd{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.9rem}
.clips .no{color:var(--muted);font-size:.9rem}
.clips .nt{font-weight:700}
.clips .nt em{display:inline-block;font-style:normal;font-weight:400;font-size:.76rem;margin-left:8px;padding:0 8px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);white-space:nowrap}
.clips .nm{grid-column:3;display:flex;flex-wrap:wrap;gap:0 16px;font-size:.84rem;color:var(--ink2)}
.clips .nm i{font-style:normal;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:5px 12px;align-items:center;font-size:.86rem;margin:10px 0 6px;max-width:42em}
.bars .bb{height:8px;border-radius:4px;background:var(--trk2);overflow:hidden}
.bars .bb i{display:block;height:100%;border-radius:4px;background:var(--rose)}
.bars .bv{color:var(--muted);font-variant-numeric:tabular-nums}
.form{display:flex;flex-wrap:wrap;gap:12px 16px;margin-bottom:10px}
.field{display:grid;gap:4px;font-size:.86rem;color:var(--muted)}
.field.grow{flex:1 1 280px}
.field input,.field select{min-height:44px;min-width:9em;padding:8px 12px;border:1.5px solid var(--ctl);border-radius:10px;background:var(--paper);color:var(--ink);font-size:1rem}
.status{font-size:.9rem;color:var(--muted);margin-bottom:10px}

/* ============ 照片：投影片 ============ */
.plate.show{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) auto;padding:0;overflow:hidden;min-height:430px}
.show:fullscreen{border-radius:0;border:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;background:var(--stage);touch-action:pan-y}
.stage img{max-width:calc(100% - 56px);max-height:calc(100% - 56px);object-fit:contain;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.12);transition:opacity .25s}
.snav{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;padding:0 0 4px;border:1.5px solid var(--ctl);border-radius:50%;background:var(--paper);font-size:1.6rem;line-height:1}
.snav.prev{left:14px}
.snav.next{right:14px}
.snav:hover{border-color:var(--ink)}
.scap{min-height:0;overflow:auto;padding:28px 24px;border-left:1px solid var(--line)}
.syear{font-family:var(--serif);font-weight:700;font-size:2.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.scap h2{font-family:var(--serif);font-weight:700;font-size:1.25rem;margin-top:10px}
.scap .kai{margin-top:8px}
.scredit{margin-top:10px;font-size:.86rem;color:var(--muted)}
.scap .sample{margin:16px 0 0;background:var(--bg)}
.sbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-width:0;padding:10px 14px;border-top:1px solid var(--line)}
.scount{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{flex:1;display:flex;gap:6px;min-width:0;padding:3px;overflow-x:auto;scrollbar-width:thin}
.strip button{flex:none;display:grid;justify-items:center;gap:1px;padding:3px;border:1.5px solid transparent;border-radius:8px;background:none;font-size:.7rem;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums}
.strip img{display:block;width:52px;height:38px;object-fit:cover;border-radius:4px}
.strip button:hover{border-color:var(--line2)}
.strip button[aria-current="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}

/* ============ 訪談 ============ */
.ivs{list-style:none;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-bottom:20px}
.plate.iv{padding:24px 26px;margin-bottom:0}
.iv-no{font-size:.78rem;letter-spacing:.16em;color:var(--muted)}
.iv h2{font-family:var(--serif);font-weight:700;font-size:1.35rem;line-height:1.35}
.meta{font-size:.88rem;color:var(--muted);margin-top:2px}
.iv .kai{margin-top:8px;max-width:44em}
.player{display:flex;align-items:center;gap:14px;margin-top:16px}
.pp{flex:none;display:grid;place-items:center;width:54px;height:54px;padding:0;border:0;border-radius:50%;background:var(--ink);color:var(--paper)}
.pp svg{width:24px;height:24px;fill:currentColor}
.pp .ic-pause,.pp.playing .ic-play{display:none}
.pp.playing .ic-pause{display:block}
.pp.sm{width:44px;height:44px}
.pp.sm svg{width:20px;height:20px}
.wavebox{position:relative;flex:1;min-width:0;height:54px}
.wave{display:flex;align-items:center;gap:2px;height:100%;overflow:hidden}
.wave i{flex:1;min-width:1px;border-radius:2px;background:var(--line2)}
.wave i.on{background:var(--rose)}
.wavebox input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.wavebox:focus-within{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.time{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr{margin-top:16px;border-top:1px solid var(--line)}
.segs{list-style:none;padding:0}
.segs li{display:grid;grid-template-columns:auto 5em minmax(0,1fr);align-items:baseline;gap:4px 12px;padding:10px;border-left:3px solid transparent;border-radius:8px}
.segs li.now{background:var(--bg);border-left-color:var(--rose)}
.ts{min-width:54px;min-height:36px;padding:2px 10px;border:1.5px solid var(--ctl);border-radius:999px;background:var(--paper);font-size:.84rem;color:var(--link);font-variant-numeric:tabular-nums}
.ts:hover{border-color:var(--ink)}
.sp{font-size:.86rem;color:var(--muted)}
.segs p{font-family:var(--kai);font-size:1.05rem;line-height:1.75}
.needs{padding-left:1.2em;font-size:.94rem}
/* 開始播放後出現在畫面下方的播放列 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px max(var(--gut),calc((100vw - 1240px)/2 + var(--gut))) calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--paper);border-top:1px solid var(--line2);box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.dock-bar{position:absolute;left:0;right:0;top:-2px;height:3px;background:var(--line)}
.dock-bar i{display:block;width:0;height:100%;background:var(--rose)}
.dock-txt{flex:1;min-width:0;display:grid;padding:2px 0;border:0;background:none;text-align:left;line-height:1.4}
.dock-txt b{font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-txt span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-time{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dock-x{min-height:44px;padding:0 8px;border:0;background:none;font-size:.88rem;color:var(--link);text-decoration:underline;text-underline-offset:3px}
body.has-dock .foot{padding-bottom:76px}

/* ============ 導覽（首頁） ============ */
.hero{background:var(--hero-bg);color:var(--hero-fg)}
.hero-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:40px;min-height:min(82vh,740px);padding-top:calc(var(--mast) + 28px);padding-bottom:40px}
.hero-title{font-family:var(--serif);font-weight:700;font-size:clamp(3rem,7.4vw,6.4rem);line-height:1.12;letter-spacing:.03em}
.hero-title:focus{outline:none}
.hero-facts{margin-top:24px;color:var(--hero-mut);font-size:1.02rem;max-width:30em}
.hero-art{display:block;justify-self:end;width:100%;max-width:640px;border-radius:6px}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art text{font-family:var(--sans)}
.hero-art:focus-visible{outline:3px solid var(--hero-fg);outline-offset:6px}
.hero .grow{stroke-dasharray:1;stroke-dashoffset:1;animation:grow var(--t) ease-out var(--d) forwards}
.hero .pop{opacity:0;animation:pop .35s ease-out var(--d) forwards}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
.dir{padding:44px 0 8px}
.dir h2{font-size:.8rem;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-bottom:8px}
.dir ol{list-style:none;padding:0;border-bottom:1px solid var(--line2)}
.dir-row{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,400px) 34px;align-items:center;gap:8px 28px;padding:20px 12px;border-top:1px solid var(--line2);color:var(--ink);text-decoration:none;transition:background .15s}
.dir-row:hover{background:var(--paper)}
.dir-row:focus-visible{outline-offset:-3px}
.dir-no{font-family:var(--serif);font-size:1.45rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums lining-nums}
.dir-txt{display:grid;gap:2px}
.dir-txt b{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1.35}
.dir-txt span{color:var(--ink2);font-size:.96rem;max-width:34em}
.dir-thumb{display:grid;gap:2px;min-width:0}
.dir-go{justify-self:end;font-size:1.3rem;color:var(--muted);transition:transform .15s}
.dir-row:hover .dir-go{transform:translateX(4px);color:var(--ink)}
.dir-row.plain{padding-block:16px}
.th-line svg{display:block;width:100%;height:auto}
.th-cap{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:.78rem;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums}
.th-cap b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--ink)}
.th-cap span:last-child{text-align:right}
.th-roses{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.th-roses > span{display:grid;justify-items:center;gap:1px}
.th-roses .rose{width:100%;max-width:56px}
.th-roses i{font-style:normal;font-size:.72rem;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums}
.th-photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.th-photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.th-wave{display:flex;align-items:center;gap:3px;height:54px}
.th-wave i{flex:1;border-radius:2px;background:var(--rose);opacity:.8}

/* ============ 關於 ============ */
.about{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;align-items:start;padding-top:6px}
.atoc{position:sticky;top:calc(var(--mast) + 20px);display:grid;gap:2px;border-left:1px solid var(--line2)}
.atoc button{min-height:40px;margin-left:-1px;padding:8px 14px;border:0;border-left:2px solid transparent;background:none;text-align:left;font-size:.92rem;color:var(--ink2)}
.atoc button:hover{color:var(--ink);border-left-color:var(--ink)}
.abody{max-width:44em}
.abody section+section{margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.abody h2{font-family:var(--serif);font-weight:700;font-size:1.5rem;line-height:1.35}
.abody h2:focus{outline:none}
.abody h3{font-size:1.02rem;font-weight:700;margin-top:20px}
.abody p,.abody ul{margin-top:10px}
.abody ul{padding-left:1.2em}
.abody li{margin-top:6px}
.fill{margin-top:14px;border-top:1px solid var(--line)}
.fill > div{display:grid;grid-template-columns:11em minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fill dt{color:var(--muted)}
.todo{color:var(--muted)}

/* ============ 頁尾、上一頁／下一頁、提示框 ============ */
.route{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px;padding-top:14px;border-top:1px solid var(--line2)}
.rt{display:grid;padding:10px 4px;color:var(--ink);text-decoration:none}
.rt small{font-size:.78rem;letter-spacing:.14em;color:var(--muted)}
.rt b{font-family:var(--serif);font-size:1.25rem;line-height:1.4}
.rt.next{text-align:right}
.rt.prev b::before{content:"← "}
.rt.next b::after{content:" →"}
.rt:hover b{text-decoration:underline;text-underline-offset:5px}
.foot{margin-top:20px;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;padding-top:22px;padding-bottom:28px;font-size:.88rem;color:var(--muted)}
.foot b{font-family:var(--serif);font-size:.98rem;color:var(--ink)}
/* 新手導覽：把要說明的地方框起來，其餘變暗 */
.tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 2px var(--paper),0 0 0 200vmax rgba(10,16,18,.62);pointer-events:none;transition:left .22s,top .22s,width .22s,height .22s}
.tour-card{position:fixed;width:min(360px,calc(100vw - 24px));padding:18px 20px 16px;border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 14px 40px rgba(0,0,0,.32);transition:left .22s,top .22s}
.tour-step{display:flex;justify-content:space-between;font-size:.78rem;letter-spacing:.16em;color:var(--muted)}
.tour-card h2{font-family:var(--serif);font-weight:700;font-size:1.2rem;line-height:1.4;margin-top:2px}
.tour-card h2+p{margin-top:6px;font-size:.96rem;line-height:1.75}
.tour-btns{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour-btns .gap{flex:1}
.tip{position:fixed;z-index:80;max-width:min(320px,calc(100vw - 16px));padding:8px 12px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:.84rem;line-height:1.5;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.tip b{display:block}

/* ============ 平板與手機 ============ */
@media (max-width:1100px){ :root{--gut:28px} .rz{grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:16px 24px} }
@media (max-width:859px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .rz{grid-template-columns:minmax(0,1fr);gap:18px}
  .rz-head{justify-content:space-between}
  .rz-title{min-width:0}
  .rz-era{font-size:1.5rem}
  .plate.show{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;min-height:0}
  .stage{aspect-ratio:4/3;max-height:58vh}
  .stage img{max-width:calc(100% - 28px);max-height:calc(100% - 28px)}
  .scap{border-left:0;border-top:1px solid var(--line);padding:16px 18px;overflow:visible}
  .syear{font-size:1.7rem}
  .sbar{flex-wrap:wrap}
  .strip{order:5;flex:1 1 100%}
  .hero-in{grid-template-columns:minmax(0,1fr);gap:24px;min-height:0;padding-top:calc(var(--mast) + 26px);padding-bottom:28px}
  .hero-art{justify-self:center;max-width:560px}
  .dir{padding-top:28px}
  .dir-row{grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:18px 4px}
  .dir-no{font-size:1.05rem;align-self:start;padding-top:.5em;min-width:1.6em}
  .dir-txt b{font-size:1.35rem}
  .dir-thumb{grid-column:1/-1;margin-top:8px}
  .dir-go{grid-column:3;grid-row:1}
  .about{grid-template-columns:minmax(0,1fr);gap:20px}
  .atoc{position:static;display:flex;flex-wrap:wrap;gap:6px;border-left:0}
  .atoc button{margin:0;padding:6px 14px;border:1.5px solid var(--ctl);border-radius:999px}
  .atoc button:hover{border-color:var(--ink)}
}
@media (max-width:719px){
  :root{--gut:16px; --mast:46px}
  body{font-size:15.5px}
  .brand{display:none}
  .mast-in{padding-inline:6px}
  .nav{flex:1;justify-content:space-between;gap:0;margin:0}
  .nav a{flex:1 1 auto;justify-content:center;padding:0 4px;font-size:.92rem}
  .nav a[aria-current="page"]::after{left:3px;right:3px}
  .ph{padding:16px 0 12px}
  .ph-site{display:inline}
  .ph-no::before{width:14px;margin-right:8px}
  .ph-lead{font-size:1rem}
  .subnav a{flex:1 1 0;min-width:0;padding:8px 12px}
  .seg button{padding:6px 15px}
  .src{margin-left:0;flex-basis:100%;text-align:left}
  .plate{padding:16px}
  .more{padding:4px 16px}
  .more[open]{padding-bottom:16px}
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 12px;padding:11px 16px}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .stat .v{grid-column:2;grid-row:1;font-size:1.5rem}
  .stat .sub{grid-column:1/-1}
  .tbl{font-size:.74rem}
  .tbl th,.tbl td{padding:6px 2px}
  .heat,.heat tbody{display:block}

    <section>
      <h2 id="ab2" tabindex="-1">資料來源與整理方式</h2>
      <ul>
        <li><b>時間軸</b>：來自「智能障礙重大事件表」的 18 件事，說明與備註保留原文。兩條主幹與測驗的兩個分支是整理時分的；標為「1970 年代」的事件畫在 1970 年的位置。背景的用詞比例由新聞資料算出，每五年一段（1980 年以前每十年一段）。新聞資料到 2022 年，2023 年以後的背景沿用 2020–2022 年的比例，圖上用虛線和較淡的顏色標示。</li>
        <li><b>剪報</b>：使用「2026整理」工作表的 738 篇。日期取自「0815合併原始檔」的日期欄（721 篇對得到），其餘 17 篇用檔名開頭的日期；標題取自檔名。</li>
        <li><b>觀點</b>：用「主要事件觀點」，可以加上「次要敘述觀點」。編為「無」或沒有填的不畫在圓圈裡，另外寫出篇數。</li>
        <li><b>主題</b>：用「重編主題」的大類。專家學者意見與專家學者分享合併為「專家學者」，三種表揚合併為「表揚」，其餘以「-」前面的字為大類；點某一格會列出細項。</li>
        <li><b>用詞</b>：寫法相近的併成一組，例如「白痴/低能」與「低能」、「憨兒」與「喜憨兒」、「心智障礙」與「心智障礙者」。只出現一兩次的 37 種寫法歸為「其他用詞」。</li>
        <li><b>標記</b>：原表有 18 篇標記為「有出現關鍵字但主體非智能障礙者」，目前計入統計，在剪報清單裡會標示。</li>
        <li><b>沒有放上來的欄位</b>：備註欄有當事人的姓名，所以沒有放進網頁。剪報標題取自檔名，少數也含有姓名，公開分享前請再檢查。</li>
        <li><b>研究文獻</b>：「Design_themes」工作表的 426 篇。文獻用詞取自「Terms」工作表的 628 筆（兩筆空白略過），以「智能障礙」開頭的寫法併入智能障礙，英文與少見的寫法歸為其他。</li>
        <li><b>學生人數</b>：全台用「通報網全台數據」，台北市用「台北市年報」，智能障礙總人數用「衛福部全台數據」。表裡的 ID、ASD、LD、CP、OTHER 分別顯示為智能障礙、自閉症、學習障礙、腦性麻痺、其他障礙。腦性麻痺欄位填 0 的年度不畫。</li>
      </ul>
    </section>

    <section>
      <h2 id="ab3" tabindex="-1">圖表怎麼看</h2>
      <p>每個展區第一次進來時，會出現幾個步驟的導覽；之後可以按標題旁的「怎麼看」重看。</p>
      <h3>時間軸</h3>
      <ul>
        <li>電腦上是一棵由下往上長的樹，越上面越晚；手機上是由上往下排的直式時間軸，一行一件事。兩條主幹是「測驗」與「法規與鑑定」（菱形）；測驗再分成智力測驗（圓形）與適應行為量表（方形）兩支。</li>
        <li>點任何一個事件，會顯示日期與說明。說明裡可以往前、往後看相連的事件，也可以用「上一件／下一件」依時間順序一件一件看。</li>
        <li>背景色塊是同一時間報紙用詞的比例。點圖下方的用詞，可以單獨看那個詞，法規裡用到這個詞的事件會保持清楚，其他的變淡。</li>
        <li>點年代（例如 1980），會列出那十年的重大事件、剪報、研究與學生人數。</li>
        <li>「文字清單」會把事件排成純文字的清單。按 Esc 或「清除選取」取消選取。</li>
      </ul>
      <h3>學生人數與研究文獻的圖表</h3>
      <ul>
        <li>折線圖與長條圖：滑鼠移到圖上（手機用手指點）會顯示那一年的數字。</li>
        <li>各障別人數的圖上，圓圈標出智能障礙與學習障礙、自閉症人數交叉的位置，移上去或點一下會顯示說明。</li>
        <li>表格的底色越深，代表占那一欄的比例越高。</li>
      </ul>
      <h3>剪報的圓圈圖</h3>
      <ul>
        <li>中間是一個圓，外面平分成幾格，每格對應一個編碼類別，每一圈格子的位置都一樣。</li>
        <li>每一格從中間的圓往外凸，凸出的面積和「那個年代有多少比例的新聞屬於這一格」成正比；凸到最外面代表的比例，所有圓圈都一樣。</li>
        <li>顏色最深的一格是那個年代比例最高的類別。格子順時針依這個類別「平均出現的年份」由早到晚排。</li>
        <li>圖上只寫類別名稱。大圈中間是一組數字（比例與篇數），屬於外圈標成深色的那個類別：平常是比例最高的一格；滑鼠移到別的格子上或點一下，就換成那一格。</li>
        <li>一進來，大圈是全部年代。點一個年代的小圓圈，大圈換成那個年代，再點一次回到全部年代；點大圈的任何一格，所有圓圈只亮那一格，下面列出那些新聞。手機上可以在大圈上左右滑，換上一個或下一個年代。</li>
        <li>大圈右邊的折線，是同一個類別在各年代的比例，會跟著你移到或點選的那一格更換；折線下面每個年代一個小圓圈，點一下，大圈就換成那個年代。</li>
        <li>頁面最下面的「看各年代的數字」有完整的表。</li>
      </ul>
    </section>

    <section>
      <h2 id="ab4" tabindex="-1">無障礙說明</h2>
      <ul>
        <li><b>鍵盤操作</b>：所有功能都可以用鍵盤操作。Tab 移動、Enter 選取、Esc 取消；頁面最上方有「跳到主要內容」的連結。切換展區後，焦點會移到展區標題。</li>
        <li><b>不只靠顏色</b>：時間軸同時用顏色和形狀區分主幹與分支；圓圈圖靠位置和文字標示；圖表的顏色用色盲模擬檢查過。</li>
        <li><b>文字替代</b>：圖表附有數字表；時間軸有純文字清單。照片需附替代文字，訪談錄音需附逐字稿。</li>
        <li><b>對比與字級</b>：內文與背景的對比在 4.5:1 以上；按鈕邊框、圖表的線與長條在 3:1 以上。時間軸的背景色塊刻意較淡，可以點圖下方的用詞加深單一色塊，數字在剪報展區的「用詞」。字級使用相對單位，可以用瀏覽器放大。</li>
        <li><b>手機與電腦</b>：版面會依螢幕寬度重新排列，圖表依寬度重畫，不需要左右捲動。照片與圓圈圖可以左右滑動，也都有按鈕可以按。</li>
        <li><b>其他</b>：手機與平板上，主要按鈕至少 44 像素高；支援深色模式；會依系統設定減少動畫。</li>
      </ul>
    </section>

// 樹的背景：報紙用哪個詞。把新聞分成幾段時間，算每一段有多少比例的新聞用到這個詞
const TERM_BANDS=[['w1','白痴／低能'],['w2','智能不足'],['w3','智障'],['w4','智能障礙']];
const TERM_BINS=[[1960,1969],[1970,1979],[1980,1984],[1985,1989],[1990,1994],[1995,1999],[2000,2004],[2005,2009],[2010,2014],[2015,2019],[2020,2022]];
function buildTermTrends(){
  const out={};
  TERM_BANDS.forEach(([id,name])=>{
    const curve=[];
    TERM_BINS.forEach(([lo,hi],i)=>{
      const A=NEWS.filter(a=>a.y>=lo&&a.y<=hi), v=A.length?A.filter(a=>a.wg.includes(name)).length/A.length:0;
      const mid=(lo+hi+1)/2, y=Math.floor(mid), m=Math.round((mid-y)*12)+1;
      if(i===0) curve.push(['1962-01',v]);
      curve.push([y+'-'+String(m).padStart(2,'0'), v]);
      if(i===TERM_BINS.length-1) curve.push(['2022-12',v]);
    });
    const use=NEWS.filter(a=>a.wg.includes(name));
    let best=null;
    DECADES.forEach(d=>{ const A=NEWS.filter(a=>a.dec===d); const p=A.length?A.filter(a=>a.wg.includes(name)).length/A.length:0; if(!best||p>best.p) best={d,p}; });
    out[id]={name, curve,
      span:'新聞裡出現的年份：'+use[0].y+'–'+use[use.length-1].y,
      desc:NEWS.length+' 篇新聞裡，有 '+use.length+' 篇用到「'+name.replace('／','」或「')+'」（'+pct(use.length/NEWS.length)+'）。比例最高的是 '+best.d+'年代（'+pct(best.p)+'）。\n背景色塊的寬度，是這個詞在四個主要用詞裡占的比例；一篇新聞可能同時用好幾個詞。'};
  });
  return out;
}

/* 背景：報紙用哪個詞。每個詞在某個時間點占四個主要用詞的比例 */
const TERMS = TREE.trends, TERM_IDS = Object.keys(TERMS);
TERM_IDS.forEach(k=>{ TERMS[k].pts = TERMS[k].curve.map(c=>{ const p = c[0].split('-').map(Number); return [p[0]+((p[1]||1)-1)/12, c[1]]; }); });

const STACK = (()=>{ const c = k => { const p = TERMS[k].pts, w = p.reduce((a,x)=>a+x[1],0)||1; return p.reduce((a,x)=>a+x[0]*x[1],0)/w; }; return [...TERM_IDS].sort((a,b)=>c(a)-c(b)); })();

  const p = TERMS[k].pts; if(t<=p[0][0]) return p[0][1];

/* 狀態：選了哪個事件、哪個用詞、哪個年代；是否改看文字清單 */
let tSel = null, tTerm = null, tEra = null, tList = false, TL = null;
const tAny = () => !!(tSel || tTerm || tEra!=null);
function relatedSet(){
  if(tSel){ const e = byId[tSel]; return new Set([tSel, ...e.parents.filter(p=>p!=='root'), ...EVENTS.filter(x=>x.parents.includes(tSel)).map(x=>x.id)]); }
  if(tTerm) return new Set(EVENTS.filter(e=>(e.trends||[]).includes(tTerm)).map(e=>e.id));
  if(tEra!=null) return new Set(EVENTS.filter(e=>e.dec===tEra).map(e=>e.id));

/* ---------- 排版 ---------- */
const curveD = (A,B) => { const my = ((A.y+B.y)/2).toFixed(1); return `M${A.x.toFixed(1)} ${A.y.toFixed(1)} C${A.x.toFixed(1)} ${my} ${B.x.toFixed(1)} ${my} ${B.x.toFixed(1)} ${B.y.toFixed(1)}`; };
const curvePts = (A,B,n) => { const my = (A.y+B.y)/2, out = []; for(let i=0;i<=n;i++){ const t = i/n, u = 1-t; out.push({x:A.x*(u*u*u+3*u*u*t)+B.x*(3*u*t*t+t*t*t), y:A.y*u*u*u+my*(3*u*u*t+3*u*t*t)+B.y*t*t*t}); } return out; };
// 枝條：同一條主幹有兩支以上從樹根長出來時，先合成一條，再分支
function treeSegments(pos, juncY){
  const junc = {}, segs = [];
  Object.keys(THEMES).forEach(t=>{ const ks = kidsOf('root').filter(e=>e.theme===t); if(ks.length<2) return;
    const xs = ks.map(e=>pos[e.id].x); junc[t] = {x:(Math.min(...xs)+Math.max(...xs))/2, y:juncY(ks)};
    segs.push({a:pos.root, b:junc[t], theme:t, w:7, from:'root', to:null}); });
  EVENTS.forEach(e=>{ if(e.id==='root') return; const p = e.parents[0], A = (p==='root' && junc[e.theme]) || pos[p];
    let d = 0, q = p; while(q && q!=='root'){ d++; q = byId[q].parents[0]; }
    segs.push({a:A, b:pos[e.id], theme:e.theme, w:Math.max(3.2, 6.4-d*.85), from:p, to:e.id}); });
  return {junc, segs};
}
// 寬的畫面：樹狀。名稱寫在節點旁邊，先試右邊，會壓到枝條或別的名稱時換位置
function layoutTree(W,H){
  const AX = 50, T = 44, B = 46, fs = 13, lh = 16.5, base = H-B;
  const lw = e => Math.ceil(Math.max(...e.lines.map(s=>textW(s,fs))))+12, lhh = e => e.lines.length*lh+7;
  const lastW = Math.max(...EVENTS.filter(e=>e.id!=='root' && COL[e.id]===LEAFN-1).map(lw));
  const x0 = AX+30; let pitch = (W-x0-lastW-28)/(LEAFN-1), shift = 0;
  if(pitch>184){ shift = (pitch-184)*(LEAFN-1)/2; pitch = 184; }
  const X = c => x0+shift+c*pitch, Y = t => base-(t-Y0)/(Y1-Y0)*(base-T);
  const pos = {}; EVENTS.forEach(e=>{ pos[e.id] = e.id==='root' ? {x:X(COL.root), y:base} : {x:X(COL[e.id]), y:Y(e.t)}; });
  const {junc, segs} = treeSegments(pos, ks=>base-Math.max(12, Math.min(40, (base-Math.max(...ks.map(e=>pos[e.id].y)))*.5)));
  // 不能壓到的東西：枝條上的點、其他事件的節點、分支點
  const obst = [];
  segs.forEach(s=>curvePts(s.a,s.b,24).forEach(p=>obst.push({x:p.x, y:p.y, r:s.w/2+2.5, ids:[s.from,s.to]})));
  EVENTS.forEach(e=>obst.push({x:pos[e.id].x, y:pos[e.id].y, r:9.5, ids:[], node:e.id}));
  Object.values(junc).forEach(j=>obst.push({x:j.x, y:j.y, r:7, ids:[]}));
  const boxes = [{x:AX+4, y:Y(DATA_END)-19, w:150, h:17}];          // 虛線上方那一行小字的位置先留下來
  const free = (b,id) => b.x>=AX+3 && b.x+b.w<=W-3 && b.y>=3 && b.y+b.h<=base-1 &&
    !boxes.some(p=>b.x<p.x+p.w+4 && p.x<b.x+b.w+4 && b.y<p.y+p.h+3 && p.y<b.y+b.h+3) &&
    !obst.some(o=>{ if(id && o.node===id) return false; if(id && o.ids.includes(id) && Math.hypot(o.x-pos[id].x,o.y-pos[id].y)<13) return false;
      return o.x>b.x-o.r && o.x<b.x+b.w+o.r && o.y>b.y-o.r && o.y<b.y+b.h+o.r; });

    const cx = lf.reduce((a,e)=>a+pos[e.id].x,0)/lf.length, top = Math.min(...ev.map(e=>pos[e.id].y-10), ...labels.filter(b=>byId[b.id].sub===k).map(b=>b.y));

    put(SUBS[k].name, SUBS[k].shape, ev[0].theme, c, w, h); });
  Object.keys(THEMES).forEach(t=>{ const w = textW(THEMES[t].name,13)+26, h = 20, c = [];
    if(junc[t]){ const j = junc[t]; for(let i=0;i<8;i++) c.push([j.x-10-w, j.y-h/2+6+i*4]); for(let i=1;i<8;i++) c.push([j.x-10-w, j.y-h/2+6-i*5]); }
    else { const s = segs.find(s=>s.from==='root' && s.theme===t), m = curvePts(s.a,s.b,10)[5]; for(let i=0;i<10;i++) c.push([m.x+12, m.y-h/2+i*5]); for(let i=1;i<10;i++) c.push([m.x+12, m.y-h/2-i*5]); }

}
// 窄的畫面：直式時間軸。一行一件事，年代之間有分隔線；背景的時間跟著每一行的位置伸縮
function layoutLanes(W){
  const roomy = W>=480, LP = roomy?24:18, X0 = roomy?30:22, X = c => X0+c*LP;
  const yearX = X(LEAFN-1)+(roomy?26:18), titleX = yearX+(roomy?60:52), RH = 46, DH = 36, TOP = 26;
  const pos = {root:{x:X(COL.root), y:TOP}}, rows = [], seps = [{d:DECADES[0], y:TOP}], anchors = [[TOP,Y0]];
  let y = TOP+32;
  DECADES.slice(1).forEach(d=>{
    const sy = y+DH/2; seps.push({d, y:sy}); anchors.push([sy,d]); y += DH;
    ORDER.map(id=>byId[id]).filter(e=>e.dec===d).forEach(e=>{ const ry = y+RH/2; pos[e.id] = {x:X(COL[e.id]), y:ry}; rows.push({e, y:ry}); anchors.push([ry, Math.max(e.t,d+.3)]); y += RH; });
  });

  const yOfT = t => { const [a,b] = seg(t,1); return a[0]+(b[0]-a[0])*Math.min(1,Math.max(0,(t-a[1])/((b[1]-a[1])||1))); };
  const samples = []; for(let yy=TOP; yy<H; yy+=5) samples.push({y:yy, t:tOfY(yy)}); samples.push({y:H, t:Y1});
  const {junc, segs} = treeSegments(pos, ks=>TOP+Math.min(20, (Math.min(...ks.map(e=>pos[e.id].y))-TOP)*.4));

/* ---------- 畫圖 ---------- */

    if(a==='tl-list'){ tList = !tList; render(); return; }

// 右邊的折線圖：目前這個類別（中間數字所屬的那一格）在各年代的比例。每個年代一欄，和下面的小圓圈對齊
let trendCtx = null;
function trendSvg(W){
  const c = trendCtx, cat = c.cur, n = DECADES.length, small = W<460, H = small?150:190, T = 26, B = 12, col = W/n;
  const x = i => col*(i+.5), y = v => T+(H-T-B)*(1-Math.min(v/c.max,1)), vals = c.stDec.map(s=>s.share(cat));
  let g = '';
  // 刻度：分成兩段或三段，取得到 5% 倍數的那一種
  const pm = Math.round(c.max*100), parts = pm%10===0 ? 2 : pm%15===0 ? 3 : 1;
  for(let k=0;k<=parts;k++){ const v = c.max*k/parts, yy = y(v).toFixed(1);
    g += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"${k?' stroke-dasharray="2 5"':''}/><text x="2" y="${yy-4}" font-size="11" fill="var(--muted)">${pct(v)}</text>`; }
  if(c.era!=null){ const i = DECADES.indexOf(c.era); g += `<rect x="${(col*i+3).toFixed(1)}" y="6" width="${(col-6).toFixed(1)}" height="${H-6}" rx="8" fill="var(--trk2)"/>`; }
  g += `<polyline points="${vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--rose)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{ const on = c.era===DECADES[i];
    g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${on?6.5:4.5}" fill="${on?'var(--rose)':'var(--paper)'}" stroke="var(--rose)" stroke-width="2.5"/>`;
    if(on) g += `<text x="${x(i).toFixed(1)}" y="${(y(v)-12).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" stroke="var(--paper)" stroke-width="3.5" paint-order="stroke">${pct(v)}</text>`; });
  DECADES.forEach((d,i)=>{ g += `<rect class="tcol" x="${(col*i).toFixed(1)}" y="0" width="${col.toFixed(1)}" height="${H}" data-pick="${d}" data-tip="${esc(d+'年代・'+cat+'\n'+c.stDec[i].count[cat]+' 篇，占這個年代新聞的 '+pct(vals[i]))}"/>`; });
  return `<svg class="trend" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cat+'在各年代的比例：'+DECADES.map((d,i)=>d+'年代 '+pct(vals[i])).join('，'))}">${g}</svg>`;
}

const PL = {i:-1, t:0, playing:false, timer:null, audio:null}, WAVE_N = 72, dock = $('#dock');
function plStop(){ if(PL.timer){ clearInterval(PL.timer); PL.timer = null; } if(PL.audio) PL.audio.pause(); PL.playing = false; }
function plPaint(){
  const i = PL.i, a = INTERVIEWS[i]; if(!a) return;
  const dur = a.dur||1, t = Math.min(PL.t,dur); let cur = -1; a.segs.forEach((s,k)=>{ if(t>=s[0]) cur = k; });

    const done = Math.round(t/dur*WAVE_N);
    $$('.wave i',el).forEach((b,k)=>b.classList.toggle('on',k<done));
    $('.time',el).textContent = mmss(t)+' / '+mmss(dur);

  }

    $('#dockTitle').textContent = a.title; $('#dockTime').textContent = mmss(t)+' / '+mmss(dur);

  }

}
function plReset(i){
  const el = $('.iv[data-iv="'+i+'"]'); if(!el) return; const a = INTERVIEWS[i];
  $$('.wave i',el).forEach(b=>b.classList.remove('on')); $$('.segs li',el).forEach(li=>li.classList.remove('now'));
  $('.time',el).textContent = '0:00 / '+mmss(a.dur); $('input[type=range]',el).value = 0;
  const pp = $('.pp',el); pp.setAttribute('aria-pressed','false'); pp.setAttribute('aria-label','播放：'+a.title); pp.classList.remove('playing');

function plLoad(i){
  if(PL.i===i) return; const old = PL.i; plStop(); PL.audio = null; PL.i = i; PL.t = 0; if(old>=0) plReset(old);

    PL.audio.addEventListener('loadedmetadata',()=>{ if(isFinite(PL.audio.duration)) a.dur = PL.audio.duration; plPaint(); }); PL.audio.addEventListener('ended',()=>{ PL.playing = false; plPaint(); }); }

function plPlay(){
  const a = INTERVIEWS[PL.i]; if(!a) return; PL.playing = true;

  else { if(PL.t>=a.dur) PL.t = 0; PL.timer = setInterval(()=>{ PL.t += .25; if(PL.t>=a.dur){ PL.t = a.dur; plStop(); } plPaint(); }, 250); }
  plPaint();
}
function plToggle(i){ plLoad(i); if(PL.playing){ plStop(); plPaint(); } else plPlay(); }
function plSeek(i,t,play){ plLoad(i); PL.t = Math.max(0, Math.min(t,INTERVIEWS[i].dur)); if(PL.audio) PL.audio.currentTime = PL.t; if(play && !PL.playing) plPlay(); else plPaint(); }

/* ============ 導覽（首頁）：一棵隨年代長出來的事件樹，下面是各展區的目錄 ============ */
function heroTreeSvg(){
  const big = vw()<720, k = big?1.45:1;                 // 手機上整張圖會縮小，字和節點先放大
  const W = 560, H = 470, L = big?58:44, Rm = 14, T = big?40:30, base = H-14, f = v => v.toFixed(1);
  const yOf = y => base-(y-Y0)/(Y1-Y0)*(base-T);
  const at = y => (Math.max(y-Y0,0)/(Y1-Y0)*2.6).toFixed(2);            // 動畫：年份越晚，越晚長出來
  const tl = L+50, tr = W-Rm-44, colW = (tr-tl)/Math.max(LEAFN-1,1), pos = {};
  EVENTS.forEach(e=>{ pos[e.id] = {x:tl+COL[e.id]*colW, y:e.id==='root' ? base : yOf(e.t)}; });
  const hue = t => ({test:'var(--hero-a)', law:'var(--hero-b)'})[t]||'var(--hero-fg)';
  let g = '';
  // 背景：報紙用詞的比例
  const samp = []; for(let k=0;k<=110;k++){ const yv = Y0+(Y1-Y0)*k/110; samp.push({y:yOf(yv), sh:shares(yv)}); }
  STACK.forEach((t,i)=>{ const l = samp.map(p=>f(L+p.sh[i][0]*(W-Rm-L))+','+f(p.y)), r = samp.map(p=>f(L+p.sh[i][1]*(W-Rm-L))+','+f(p.y)).reverse();
    g += `<polygon points="${l.concat(r).join(' ')}" fill="var(--hero-fg)" opacity="${[.05,.09,.14,.2][Math.min(i,3)]}"/>`; });
  g += `<rect x="${L}" y="${yOf(Y1)}" width="${W-Rm-L}" height="${f(yOf(DATA_END)-yOf(Y1))}" fill="var(--hero-bg)" opacity=".55"/><line x1="${L}" x2="${W-Rm}" y1="${f(yOf(DATA_END))}" y2="${f(yOf(DATA_END))}" stroke="var(--hero-mut)" stroke-width="1" stroke-dasharray="5 4" opacity=".7"/>`;
  for(let d=1970; d<=2020; d+=10) g += `<line x1="${L}" x2="${W-Rm}" y1="${f(yOf(d))}" y2="${f(yOf(d))}" stroke="var(--hero-fg)" stroke-width="1" opacity=".14"/><text x="${L-8}" y="${f(yOf(d)+4)}" text-anchor="end" font-size="${f(11.5*k)}" fill="var(--hero-mut)">${d}</text>`;
  // 主幹與分支
  const {junc, segs} = treeSegments(pos, ks=>base-Math.max(10,(base-Math.max(...ks.map(e=>pos[e.id].y)))*.5));
  segs.forEach(s=>{ const fromRoot = s.from==='root', t0 = fromRoot ? Y0 : byId[s.from].t;
    const d = s.to ? (fromRoot ? '.3' : at(t0)) : '0', dur = s.to ? Math.max(at(byId[s.to].t)-at(t0), .25).toFixed(2) : '.35';
    g += `<path class="grow" pathLength="1" style="--d:${d}s;--t:${dur}s" d="${curveD(s.a,s.b)}" fill="none" stroke="${hue(s.theme)}" stroke-width="${f(Math.max(2.6,s.w*.92)*(big?1.25:1))}" stroke-linecap="round" opacity=".85"/>`; });
  Object.keys(junc).forEach(t=>{ g += `<circle cx="${f(junc[t].x)}" cy="${f(junc[t].y)}" r="4.5" fill="${hue(t)}"/>`; });
  g += `<circle cx="${f(pos.root.x)}" cy="${f(pos.root.y)}" r="5.5" fill="var(--hero-fg)"/>`;
  ORDER.forEach(id=>{ const e = byId[id], p = pos[id];
    g += `<g class="pop" style="--d:${at(e.t)}s" data-tip="${esc(e.title+'\n'+whenLong(e))}">${mark(shapeOf(e),p.x,p.y,big?8:6.2,`fill="var(--hero-bg)" stroke="${hue(e.theme)}" stroke-width="${big?3.4:2.6}"`)}<circle cx="${f(p.x)}" cy="${f(p.y)}" r="13" fill="transparent"/></g>`; });
  // 每一支的名稱
  const groups = Object.keys(SUBS).map(k=>({name:SUBS[k].name, ev:EVENTS.filter(e=>e.sub===k)}))
    .concat(Object.keys(THEMES).filter(t=>!EVENTS.some(e=>e.theme===t&&e.sub)).map(t=>({name:THEMES[t].name, ev:EVENTS.filter(e=>e.theme===t)})));
  groups.forEach(gr=>{ if(!gr.ev.length) return; const lf = gr.ev.filter(e=>!kidsOf(e.id).length), xs = lf.map(e=>pos[e.id].x), top = Math.min(...gr.ev.map(e=>pos[e.id].y));
    g += `<text class="pop" style="--d:${at(Math.max(...gr.ev.map(e=>e.t)))}s" x="${f((Math.min(...xs)+Math.max(...xs))/2)}" y="${f(top-(big?18:15))}" text-anchor="middle" font-size="${f(12.5*k)}" font-weight="700" fill="var(--hero-fg)">${esc(gr.name)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${g}</svg>`;
}
// 目錄裡的縮圖
function miniTimelineSvg(){        // 時間軸：事件依年份排在兩條線上
  const W = 300, H = 64, x = t => 12+(t-Y0)/(Y1-Y0)*(W-24), rows = {test:22, law:44};
  let g = '';
  for(let d=1970; d<=2020; d+=10) g += `<line x1="${x(d).toFixed(1)}" x2="${x(d).toFixed(1)}" y1="9" y2="${H-9}" stroke="var(--line)" stroke-width="1"/>`;
  Object.keys(rows).forEach(k=>{ g += `<line x1="12" x2="${W-12}" y1="${rows[k]}" y2="${rows[k]}" stroke="var(--c-${k})" stroke-width="2" opacity=".4"/>`; });
  ORDER.forEach(id=>{ const e = byId[id]; g += mark(shapeOf(e), x(e.t), rows[e.theme], 4.4, `fill="var(--paper)" stroke="var(--c-${e.theme})" stroke-width="2"`); });
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${g}</svg>`;
}
function miniBarsSvg(){            // 研究：每年的研究篇數
  const y0 = LIT[0].y, y1 = LIT[LIT.length-1].y, n = y1-y0+1, c = new Array(n).fill(0); LIT.forEach(r=>c[r.y-y0]++);
  const W = 300, H = 64, mx = Math.max(...c), bw = (W-24)/n;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false"><line x1="12" x2="${W-12}" y1="${H-7.5}" y2="${H-7.5}" stroke="var(--line2)" stroke-width="1"/>${c.map((v,i)=>v ? `<rect x="${(12+i*bw+.7).toFixed(1)}" y="${(H-8-v/mx*(H-16)).toFixed(1)}" width="${(bw-1.4).toFixed(1)}" height="${(v/mx*(H-16)).toFixed(1)}" fill="var(--rose)" opacity=".85"/>` : '').join('')}</svg>`;
}

    ['research','03','研究', `${LIT.length} 篇學術文獻的編碼：研究設計、研究主題與使用的名詞。`,

view.addEventListener('click', e=>{

/* ============ 啟動 ============ */
document.documentElement.lang = 'zh-Hant-TW';
// 所有換展區的連結（頁首、目錄、上一頁／下一頁）
document.addEventListener('click', e=>{
  if(e.target.closest('[data-act="tour"]')) return startTour(page);
  const a = e.target.closest('[data-go]'); if(!a) return;
  e.preventDefault(); go(a.dataset.go, a.dataset.how);
});
document.addEventListener('keydown', e=>{
  // 圖裡的按鈕（事件、年代、圓圈圖的格子、交叉點）：Enter 或空白鍵等於點一下
  if((e.key==='Enter' || e.key===' ') && e.target instanceof SVGElement && e.target.getAttribute('role')==='button'){
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return; }
  if(e.key!=='Escape') return;
  if(page==='tree' && tAny()){ const id = tSel; tlClear(); render(); const el = id && $('#view [data-id="'+id+'"]'); if(el){ try{ el.focus({preventScroll:true}); }catch(err){} } }
  else if(page==='news' && newsCat){ newsCat = null; render(); }
});
$('#skipMain').addEventListener('click', e=>{ e.preventDefault(); const h = $('#pageTitle')||$('#heroTitle'); if(h) h.focus(); });
$('#skipList').addEventListener('click', e=>{ e.preventDefault(); tList = true; go('tree'); const b = $('.litem'); if(b) b.focus(); });
{ const h = (location.hash||'').slice(1); if(SECTIONS[h]) page = h; }
render();
if(GAS){
  // Apps Script：網址上的 #展區 要向外層詢問；中鍵開新分頁會開到內框自己的網址，所以擋掉
  try{ google.script.url.getLocation(loc=>{ gasReady = true; const h = (loc && loc.hash)||''; if(SECTIONS[h] && h!==page) go(h); else autoTour(); }); }catch(e){ gasReady = true; autoTour(); }
  document.addEventListener('auxclick', e=>{ if(e.target.closest && e.target.closest('[data-go]')) e.preventDefault(); });
} else autoTour();
window.addEventListener('hashchange', ()=>{ const h = (location.hash||'').slice(1); if(SECTIONS[h] && h!==page) go(h); });
// 視窗改變大小：圖表依新的寬度重畫；樹狀圖還要配合高度
let rT, rW = vw(), rH = window.innerHeight;
window.addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(()=>{
  const w = vw(), h = window.innerHeight; if(w===rW && h===rH) return; const wChanged = w!==rW; rW = w; rH = h;
  if(page==='tree'){ if(wChanged || (TL && TL.mode==='tree' && !tList)) render(); }
  else if(page==='photos') fitShow();
  else if(wChanged){ if(page==='news') render(); else fillCharts(); }
  syncMast();
}, 140); });
